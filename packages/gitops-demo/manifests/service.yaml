apiVersion: v1
kind: Service
metadata:
  name: podinfo-lab
  labels:
    zarf.dev/connect-name: podinfo
  annotations:
    zarf.dev/connect-description: podinfo deployed by Flux from Gitea
spec:
  type: NodePort
  selector:
    app: podinfo
  ports:
    - name: http
      port: 9898
      targetPort: 9898
      nodePort: 30898
